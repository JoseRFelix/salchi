name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Ensure Electron runtime is installed
        run: vp run --filter @salchi/desktop ensure:electron

      - name: Format
        run: vp fmt --check

      - name: Lint
        run: vp lint --report-unused-disable-directives

      - name: Typecheck
        run: vp run typecheck

      - name: Test
        run: vp run test

      - name: Install browser test runtime
        run: vp run --filter @salchi/web test:browser:install

      - name: Browser test
        run: vp run --filter @salchi/web test:browser

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Smoke CLI on every supported older Node line
        shell: bash
        run: |
          expected="salchi v$(node -p "require('./apps/server/package.json').version")"
          for node_version in 22.16.0 22.17.1 23.11.1 24.10.0; do
            actual="$(npm exec --yes --package="node@$node_version" -- node apps/server/dist/bin.mjs --version)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Node $node_version printed '$actual'; expected '$expected'." >&2
              exit 1
            fi
          done

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.cjs
          grep -nE "desktopBridge|getLocalEnvironmentBootstrap|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.cjs

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
